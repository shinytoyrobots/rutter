- id: dissent-2026-07-25-0002
  raised-at: 2026-07-25
  raised-by: flow-chavruta-pair / stability-bias
  generation: 1
  context: >
    Shipping var-3 hard-commits an on-disk session-record format that memory-of-use will
    accumulate in from day one: typed frontmatter as source of truth (collection
    "librarian.sessions", schema id "session-record@1", typed `day`, `sessions[]` entries,
    aggregate `refs`) with a regenerated markdown body view (src/session-record.ts). Three
    distinct record shapes existed across survivors (var-1 entries-in-frontmatter; var-2
    frontmatter-once + JSON body lines, which carries an empirically confirmed multi-entry-day
    frontmatter-staleness gap that no current grader catches; var-3 typed-frontmatter +
    regenerated body). SR-100 asks the shape to be "mdbase-compatible" so H2 mdbase adoption
    is a drop-in — but mdbase is NOT adopted in S1.5 (out of scope), so `session-record@1`
    is a GUESS at a schema that H2 will ratify. INV-3 forbids hard-deleting any memory-of-use
    record, and records grow ~1/day, so every day after ship makes a format migration a
    forward-only, larger operation.
  position: >
    A format that accretes append-only records under a no-hard-delete invariant is the single
    least reversible decision at this checkpoint, and it is being fixed on a guessed mdbase
    shape before mdbase exists. If H2's real mdbase collection schema differs from
    `session-record@1` (field names, ref typing, collection identity), every accumulated
    record must be migrated forward — never rewritten in place, never dropped — and the
    migration surface grows daily. This is exactly the class of decision that warrants either
    one more generation to cross-pollinate the surviving record shapes against a hardened
    schema grader, OR an explicit, tested forward-migration path shipped alongside the format,
    BEFORE the store starts filling. The eval suite has not yet ratified any record shape as
    mdbase-faithful — var-2's staleness gap proves current graders test single-entry records
    only and cannot distinguish a faithful shape from a lossy one.
  counterposition: >
    (Accepted majority.) Ship var-3's shape now. Of the three surviving shapes it is the most
    migration-friendly by construction: typed frontmatter is the source of truth (not a
    reconstruction of body lines), the format carries an explicit `schema: session-record@1`
    version string so a v2 is a normal versioned migration rather than a format archaeology
    project, and `aggregateRefs()` recomputes the frontmatter refs on every append — so var-3
    provably AVOIDS the var-2 multi-entry-day staleness gap that motivates the worry. Delaying
    ship to guess mdbase "more correctly" is speculative: mdbase's schema is an H2 artifact
    that may itself change, and SR-100's mandate is precisely to shape a compatible sidecar
    now, not to adopt mdbase. A versioned, source-of-truth-typed record IS the migration path;
    holding the desirability experiment hostage to a not-yet-existent downstream schema pays
    for a problem that has not happened.
  provisional-resolution: >
    Ship var-3's format (stability loses this round). The team is buying an early, real-world
    accumulation of memory-of-use in a versioned, typed, staleness-free shape — accepting the
    risk that H2 mdbase diverges and forces a forward-only migration over a growing record set.
    The `schema: session-record@1` version string is the acknowledged escape hatch; the team is
    accepting that no migration tooling exists yet and that the record set is small today (near
    zero) so the migration cost is lowest it will ever be — deferring the tooling until a
    concrete divergence or record-count threshold makes it load-bearing.
  reactivation-conditions:
    - type: spec-change
      check: "grep -nE 'adopt mdbase|mdbase (schema|collection)|migrat' spec/spec.md"
      condition: >
        If spec.md moves mdbase adoption in scope, publishes an actual mdbase collection
        schema, or SR-100 changes, reactivate immediately and compare the ratified schema
        against `session-record@1` for divergence before any further records accrue.
    - type: shell
      check: "find _librarian/sessions -name '*.md' | wc -l"
      condition: >
        If accumulated record count exceeds 90 (~3 months of daily capture) AND no tested
        forward-migration path exists yet, the INV-3 forward-only migration cost has crossed
        from trivial to material — require migration tooling before the next schema change.
    - type: shell
      check: "grep -rn 'session-record@2\\|SCHEMA_ID' src/session-record.ts"
      condition: >
        If SCHEMA_ID is bumped past @1 (a real second schema version appears), the migration
        risk is now concrete — dissent should be resolved via mitigate (ship migration tooling)
        rather than remaining a latent worry.
    - type: metric
      check: "eval suite finding #2 actioned — multi-entry-day mdbase-fidelity grader added"
      condition: >
        When the adversarial multi-entry-day / mdbase-fidelity correctness task is created,
        re-run it against var-3's `aggregateRefs` shape to CONFIRM the counterposition's claim
        that var-3 is staleness-free under grading, not merely under today's single-entry tests.
  status: active
  last-checked: 2026-07-27
  reactivation-count: 0
  history:
    - 2026-07-25: raised at gen-1 convergence checkpoint; provisional resolution ship var-3 format.
    - >
      2026-07-26: spec-change trigger evaluated at v3.1.0 (SCN-005 adds a `workspace`
      field to session entries). NOT reactivated: the field is additive-OPTIONAL on
      session-record@1 — schema id unchanged, pre-v3.1.0 records validate as-is, no
      migration, SR-100 untouched, mdbase adoption still out of scope. The v3.1.0
      acceptance criteria pin this (SCN-005/AC-additive-optional; task COR-R-021
      grades it). Record count at check: 1 real day-file.
    - >
      2026-07-26 (gen-3 convergence checkpoint, candidate gen-3/var-1 @ c0cc3c7): NOT
      reactivated, but one condition is now met in the CONFIRMING direction. (a) spec-change:
      mdbase adoption is still out of scope, SR-100 untouched; the only `migrat*` hits in
      spec.md are assertions that NO migration is required. (b) shell record count: 1 day
      file / 5 entries at `~/Documents/knowledge-vault/_librarian/sessions/` — far below 90,
      and the accumulated set is genuinely tiny, as the original resolution assumed. (c)
      shell SCHEMA_ID: `src/session-record.ts:29` still `"session-record@1"`; var-1 added
      only a comment explaining why an additive-optional field does not bump it. (d) metric
      (multi-entry-day / mdbase-fidelity grader): **now PARTIALLY MET** — COR-R-021
      (`evals/datasets/correctness-real-v1.jsonl:21`) grades a mixed pre-/post-v3.1.0
      MULTI-ENTRY day file for schema validation, byte-preservation of the old entry, and
      readability of both, and it PASSED for all three gen-3 variants (correctness 1.00).
      That is the counterposition's central claim ("var-3's shape is staleness-free")
      confirmed under grading rather than under single-entry tests only — the precise gap the
      position named. Residual: no grader yet exercises frontmatter/body DIVERGENCE on a
      multi-entry day (the var-2 staleness class), and the real day-file at check already has
      5 entries, so the untested case is the live case. Status left `active` at reduced force;
      once a divergence grader lands and passes, this warrants resolution via `flow-dissent`
      acknowledge rather than continued latency.
    - >
      2026-07-27: spec-change trigger evaluated at v3.2.0 (SCN-007 recall clarity). NOT
      reactivated — cleanest check yet: zero record-format delta. session-record@1
      untouched, no new fields, no migration, storage stays byte-verbatim by explicit
