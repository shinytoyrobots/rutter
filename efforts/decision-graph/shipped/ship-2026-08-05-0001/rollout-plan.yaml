    audience: "Robin's live vault (~2,300 notes, ~420 recorded refs)"
    entered-by: "operator commits the promoted working tree + restarts the MCP server / next reindex"
    flag-coverage: "n/a — no flag platform; reversibility seam = ledger file + drop-and-rebuild identity_* projection tables"
    dwell: "until the desirability-gate verdict (~2026-08-09, constitution escalation trigger 2)"
    eval-tier: "post-ship-eval/config.md — suite re-run on demand + dissent reactivation probes"
