    context: "gen-2 convergence checkpoint — metastable ship proposal for var-3-reversibility @ 71f41ff"
    full-record: "generations/gen-2/dissents/dissent-2026-08-05-0001.md"
    position: |
      SR-043's enrichment-surface closure is class-partial, not query-partial: under
      D-2's chosen reading, a ZERO-candidate unresolved ref (SR-037 rename+edit) has an
      empty candidate set, is never keyed into the enrichment index, and is therefore
      structurally unrenderable on that surface for any query. At the SR-104 corpus mix
      that is 8 of 14 unresolved refs. COR-A-020 constructs only the complementary
      (candidate-in-results) case, so the suite cannot see this. librarian-recent
      renders all classes; the two read surfaces are NOT at parity.
    counterposition: |
      The alternative rendering requires violating SR-009/SR-010 (inventing a result or
      a response-level side channel) or a nag channel against constitution preference 3;
      librarian-recent is a complete discovery surface for all unresolved classes.
    provisional-resolution: |
      Ship var-3. Stability loses the design question, wins the documentation question:
      ship record + docs must state the reading explicitly (M2). COR-A-020's pass is
      evidence var-3 beats var-1, not evidence the silence is ratified.
