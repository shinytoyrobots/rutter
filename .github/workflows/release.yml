# Stages rutter-memory on npm when a v* tag is pushed. Releases go through here, never
# from a laptop. See docs/archived/npm-plan.md, item 5.
#
# Authentication: npm trusted publishing (GitHub OIDC). There is no token: npm accepts
# this one workflow in this one repository, and nothing else.
#
# Approval: the workflow STAGES the release rather than publishing it. The version waits
# on npmjs.com, invisible to installs, until the maintainer approves it there with 2FA.
# A compromised account, action or workflow can therefore stage a release but never ship
# one. The trusted publisher on npm is set to allow staging only, so a plain
# `npm publish` here is refused (403 "OIDC permission denied for this action").
name: release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10, which has neither trusted publishing nor `npm stage`.
      # 11.19.0 is the version `npm stage publish` was checked against.
      - name: Upgrade npm for trusted publishing and staging
        run: npm install -g npm@^11.19.0

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Check the tag matches every version field
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const lock = read("package-lock.json");
            const found = {
              "package.json": read("package.json").version,
              "package-lock.json": lock.version,
              "package-lock.json packages[\"\"]": lock.packages?.[""]?.version,
              ".claude-plugin/plugin.json": read(".claude-plugin/plugin.json").version,
              "server.json": read("server.json").version,
              "server.json packages[0]": read("server.json").packages?.[0]?.version,
            };
            const wrong = Object.entries(found).filter(([, v]) => v !== tag);
            if (wrong.length) {
              for (const [file, v] of wrong) console.error(`${file} has ${v}, but the tag is v${tag}`);
              process.exit(1);
            }
            console.log(`all version fields match v${tag}`);
          '

      # Every npm release needs a CHANGELOG entry, and a GitHub Release is made from it below.
      # Fail now, before anything is staged, if the entry is missing.
      - name: Check the CHANGELOG has this version
        run: node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > /dev/null

      # Staged, not published: approve it on npmjs.com (or `npm stage approve <id>`) to release.
      - name: Stage for approval
        run: npm stage publish --provenance --access public

  # The GitHub Release mirrors the npm release. It is created as a DRAFT so nothing points at a
  # version that is not installable yet: publish it (and mark it latest) once the npm release is
  # approved. Its own job keeps `contents: write` away from the publishing job above.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Draft the GitHub Release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$(node scripts/changelog-section.mjs --title "$GITHUB_REF_NAME")" \
            --notes-file notes.md --verify-tag --draft
