spec-version: "3.10.2"
status: active
mapping-pending: false

dimensions:
  - name: correctness
    graders: [correctness]
    datasets: [correctness-real-v1, correctness-adv-v1]
    threshold: 0.95
  - name: performance
    graders: [performance]
    datasets: [performance-real-v1]
    threshold: 0.80
  - name: maintainability
    graders: [maintainability]
    datasets: [maintainability-real-v1]
    threshold: 0.70
  - name: documentation          # constitution override: replaces accessibility
    graders: [documentation]
    datasets: [documentation-real-v1]
    threshold: 0.90
  - name: security
    graders: [security]
    datasets: [security-real-v1, security-adv-v1]
    threshold: 1.0
  - name: cost
    graders: [cost]
    datasets: []
    threshold: 0.50
  - name: cross-boundary       # doctrine non-negotiable #2 (flow-operating-doctrine.md
                                # step 1); added suite 0.10.0, 2026-08-13 — see suite-version
                                # comment above for the gap this closes and why.
    graders: [cross-boundary]
    datasets: [cross-boundary-real-v1, cross-boundary-adv-v1]
    threshold: 1.0

weights:                          # sum = 1.0; documentation inherits accessibility's 0.10.
                                   # Rebalanced 2026-08-13 (suite 0.10.0) to fund
                                   # cross-boundary at 0.15 (matches security's weight —
                                   # both are threshold-1.0, no-partial-credit dimensions):
                                   # correctness 0.35->0.30, performance 0.15->0.10,
                                   # maintainability 0.15->0.10; documentation/security/cost
                                   # untouched. Reminder (flow-eval-protocol.md): weights
                                   # are tiebreaker/reporting-only — the Pareto front itself
                                   # is unweighted.
  correctness: 0.30
  performance: 0.10
  maintainability: 0.10
  documentation: 0.10
  security: 0.15
  cost: 0.10
  cross-boundary: 0.15

goodhart-mitigation:
  adversarial-required-for: [correctness, security, cross-boundary]  # cross-boundary added
                                                                       # 2026-08-13 (suite
                                                                       # 0.10.0) — constitution-
                                                                       # required-equivalent by
                                                                       # doctrine, not just
                                                                       # accepted-gap policy.
  rotation-period-days: 90
  score-climb-flag-threshold: 0.30

metastable:
  stability-threshold: 0.85
  spec-proximity-threshold: 0.60
  pareto-dimension-minimum: 2

# ---------------------------------------------------------------------------
# Scenario mappings (correctness dimension) — one per SCN.
# tasks: real correctness task IDs (one per acceptance criterion); adversarial-tasks:
# the metric-gaming holdouts in correctness-adv-v1 that probe the same scenario.
# ---------------------------------------------------------------------------
mappings:
  scenarios:
    - scenario: SCN-001
      title: A session's outcome is captured ambiently, exactly once per distinct directive
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false
      derived-requirements: [SR-001, SR-002, SR-003, SR-004, SR-013, SR-014]
      tasks: [COR-R-001, COR-R-002, COR-R-003, COR-R-004, COR-R-017, COR-R-018]  # 017/018 added @ spec v3.0.0
      adversarial-tasks: [COR-A-001, COR-A-002, COR-A-003, COR-A-009]  # in correctness-adv-v1; 009 added @ spec v3.0.0

    - scenario: SCN-002
      title: Robin recalls recent work with librarian-recent
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false
      derived-requirements: [SR-005, SR-006, SR-007]
      tasks: [COR-R-005, COR-R-006, COR-R-007, COR-R-008]
      adversarial-tasks: [COR-A-005, COR-A-008]  # phantom sessions; mtime-faked order

    - scenario: SCN-003
      title: Search results are quietly enriched with prior engagement
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false
      derived-requirements: [SR-008, SR-009, SR-010]
      tasks: [COR-R-009, COR-R-010, COR-R-011]
      adversarial-tasks: [COR-A-004, COR-A-007]  # sneaky re-rank/noise; annotate unreferenced

    - scenario: SCN-004
      title: Stateful use is instrumented so the desirability gate is measurable
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false
      derived-requirements: [SR-011, SR-012]
      tasks: [COR-R-012, COR-R-013, COR-R-014]
      adversarial-tasks: [COR-A-006]  # one search double-counted as many events

    - scenario: SCN-005
      title: Captured entries carry workspace provenance, derived automatically
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false
      derived-requirements: [SR-015, SR-016, SR-017, SR-018]
      tasks: [COR-R-019, COR-R-020, COR-R-021, COR-R-022]  # added @ spec v3.1.0
      adversarial-tasks: [COR-A-011]  # no-subprocess/no-egress repo resolution; SEC-A-013 covers injection (security dim)

    - scenario: SCN-006
      title: The librarian teaches its clients when to reach for memory
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false
      derived-requirements: [SR-019, SR-020]
      tasks: [COR-R-023, COR-R-024]  # added @ spec v3.1.0
      adversarial-tasks: [COR-A-010]  # filter must not fake coverage via summary-text matching

    - scenario: SCN-007
      title: Recorded memory reads clearly at recall time
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false
      derived-requirements: [SR-021, SR-022, SR-023]
      tasks: [COR-R-025, COR-R-026, COR-R-027]  # added @ spec v3.2.0
      adversarial-tasks: [COR-A-012]  # server must not launder records to fake clarity compliance

    # --- effort decision-graph (Phase 0), added @ spec v3.8.0 / suite 0.6.0 ---
    - scenario: SCN-008
      title: A recorded ref survives a vault rename
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false
      derived-requirements: [SR-036, SR-039, SR-040, SR-041, SR-042]
      tasks: [COR-R-028, COR-R-029, COR-R-030, COR-R-031, COR-R-032, COR-R-037, COR-R-038]  # 037 = note-identity@1 schema (SR-039), shared with SCN-009; 038 @ 0.8.0 = path resolution is disk-existence, not notes-index (production finding, spec v3.10.2)
      adversarial-tasks: [COR-A-013, COR-A-015, COR-A-021]  # near-miss hash must not bind; identity state must not be DB-cached to fake determinism; 021 @ 0.8.0 = fix must not over-correct (deleted non-note stays dead+rendered, renames still bind)
      # AC "identity pass writes nothing to the vault" is graded by the existing INV-2
      # grader (store-immutable) — cited, not duplicated here. AC "completes within
      # SR-104's bound" is carried by PERF-R-006 under the SR-104 requirement entry
      # below (report-only until the bound is calibrated).
      # Ledger path-confinement + candidate-render inertness: SEC-A-014/015 (security dim).

    - scenario: SCN-009
      title: An ambiguous disappearance is surfaced, never guessed
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false
      derived-requirements: [SR-037, SR-038, SR-039, SR-043]
      tasks: [COR-R-033, COR-R-034, COR-R-035, COR-R-036, COR-R-037]  # 037 = note-identity@1 schema (SR-039), shared with SCN-008
      adversarial-tasks: [COR-A-014, COR-A-016, COR-A-017, COR-A-020]  # no tie-breaking (constitution prohibition 8); unresolved refs not silently dropped; ledger append-only under tidy pressure; 020 @ 0.7.0 = enrichment-surface silence discriminator (SR-043 — COR-A-016 under-probed that surface, gen-1 cull finding). SR-046's holdouts (COR-A-018/019) live on its requirement entry below.
      # "Nothing on this path writes to the vault or mutates a stored session entry"
      # is graded by the existing INV-2 / INV-3 graders — cited, not duplicated.

    # --- effort decision-graph (Phase A), added @ spec v3.12.0/v4.0.0 / suite 0.9.0 ---
    - scenario: SCN-010
      title: A formed stance is captured as a position event, exactly once per distinct directive
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false
      derived-requirements: [SR-047, SR-048, SR-049, SR-050, SR-051, SR-052, SR-053, SR-054, SR-055, SR-056, SR-057]
      tasks: [COR-R-039, COR-R-040, COR-R-041, COR-R-042, COR-R-043, COR-R-044, COR-R-045, COR-R-046, COR-R-047, COR-R-048, COR-R-049, COR-R-050, COR-R-051]  # one per acceptance criterion; 042/043 split the idempotence AC (unchanged vs revises-differs, per the v4.0.0 amendment); 051 = SR-057 (v4.0.0)
      adversarial-tasks: [COR-A-022, COR-A-023, COR-A-024, COR-A-025, COR-A-026]  # 022 = SR-055 interleaving; 023/024 = regression guards for the two v4.0.0 panel amendments specifically; 025 = the panel's flagged malformed-kind corner (SR-047); 026 = anti-laundering for SR-053/054, mirrors COR-A-012
      # Write confinement to _librarian/ is graded by the existing INV-2 grader; retire's
      # append-only guarantee by INV-3; no-model-judgment fold by INV-6 — cited, not
      # duplicated here.
      # KNOWN GAP (not this round): SR-101 doesn't yet enumerate stance/topic-key fields,
      # so no SEC-A task exists for position-directive content injection. See suite-version
      # comment above. Recommend a future /flow-spec patch widening SR-101.

  # -------------------------------------------------------------------------
  # Non-functional SR mappings — consolidated onto the six Pareto dimensions
  # at flow-init (was: schema-conformance / safety ad-hoc dimensions).
  # -------------------------------------------------------------------------
  requirements:
    - requirement: SR-100
      text: Session-record frontmatter is mdbase-compatible (typed schema).
      dimension: correctness            # deterministic schema-validation task
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false
      tasks: [COR-R-015, COR-R-016]

    - requirement: SR-101
      text: Untrusted session summaries / refs stored+rendered as inert text.
      dimension: security
      dataset: security-adv-v1          # was adversarial-input-v1; folded in
      grader: security
      mapping-pending: false
      tasks: [SEC-A-001, SEC-A-002, SEC-A-003, SEC-A-004, SEC-A-005, SEC-A-006, SEC-A-007, SEC-A-008, SEC-A-009, SEC-A-010, SEC-A-011, SEC-A-012, SEC-A-013, SEC-A-014, SEC-A-015]  # 013 provenance-injection @ v3.1.0; 014 ledger path-traversal + 015 candidate-render injection @ v3.8.0 (SCN-008/009, also SR-039/SR-043)
      benign-controls: [SEC-R-004, SEC-R-005, SEC-R-006]  # in security-real-v1 (guard over-sanitizing); 006 legitimate unusual vault paths @ v3.8.0

    - requirement: SR-102
      text: No vault or session content committed to the code repository.
      dimension: security
      dataset: security-real-v1         # was repo-hygiene-v1; folded in
      grader: security
      mapping-pending: false
      tasks: [SEC-R-001, SEC-R-002, SEC-R-003]

    - requirement: SR-103
      text: User-facing how-to docs updated at every shipped development stage.
      dimension: documentation
      dataset: documentation-real-v1    # was docs-currency-real-v1; renamed
      grader: documentation
      mapping-pending: false
      tasks: [DOC-R-001, DOC-R-002, DOC-R-003, DOC-R-004, DOC-R-005]

    - requirement: SR-104
      text: The note-identity pass completes within a stated wall-time bound at live-vault scale (~2,300 notes, ~420 recorded refs).
      dimension: performance
      dataset: performance-real-v1
      grader: performance
      mapping-pending: calibration   # NOT `false`: the task exists and runs, but SR-104's
                                     # numeric bound is deliberately uncalibrated at spec
                                     # v3.8.0 (no defensible figure exists in
                                     # docs/decision-graph*.md). PERF-R-006 is REPORT-ONLY
                                     # (no budget, weight 0.0, excluded from the performance
                                     # aggregate) and exists to produce the gen-1 measured
                                     # baseline. The bound is fixed in spec/spec.md by PATCH
                                     # AMENDMENT after gen-1 measurement; only that amendment
                                     # may flip this to `false` (and give PERF-R-006 a
                                     # budget_p95_ms + non-zero weight). flow-evaluator must
                                     # never resolve this state on its own.
      tasks: [PERF-R-006]

    - requirement: SR-044
      text: Human confirmation of an unresolved-ref binding is supplied through a local CLI command; the confirmation surface is never exposed as an MCP tool.
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false           # registered @ suite 0.6.1 (spec v3.9.0, panel HITL)
      tasks: [COR-R-036]               # grades the detected: confirmed ledger effect
      adversarial-tasks: [COR-A-017]   # append-only under confirmed-append pressure
      # The no-MCP-surface clause is graded structurally at cull (variant's server.ts
      # registers no confirmation tool), not by a dataset task.

    - requirement: SR-045
      text: Matching/resolution keys strictly on the recorded (path, content-hash) pair; direct rebinding from the originally recorded pair against the current vault; newest binding wins; no chain composition.
      dimension: correctness
      dataset: correctness-real-v1
      grader: correctness
      mapping-pending: false           # registered @ suite 0.6.1 (spec v3.9.0, panel HITL)
      tasks: [COR-R-029, COR-R-030]    # determinism + read-surface resolution
      adversarial-tasks: [COR-A-013]   # near-miss hash must not bind
      # SUITE DEBT: no dedicated discriminator for strict keying (an old-hash ref must
      # stay unresolved through a new-hash binding) or for the no-chains model under a
      # double rename. The cull's decision-ledger audit must check both; a future
      # flow-eval pass owns the dedicated tasks.

    - requirement: SR-046
      text: A human-confirmed binding is never silently superseded by automatic detection — the confirmed binding is preserved, the conflict surfaced at read surfaces, and only a fresh human confirmation supersedes.
      dimension: correctness
      dataset: correctness-adv-v1
      grader: correctness
      mapping-pending: false           # registered @ suite 0.7.0 (eval-first before gen-2
                                       # dispatch — /flow-generate Step-2 halt, HITL chose
                                       # flow-eval-first over override). Spec v3.10.0 origin:
                                       # gen-1 population fork, HITL confirmed-sticky. All
                                       # three gen-1 variants predate the SR (uniform
                                       # newest-wins); their expected nonconformance is
                                       # recorded in gen-1/summary.md — gen-2 refinement item.
      tasks: []                        # no real-dataset task: the SR is an unwanted-behavior
                                       # guard; both probes are adversarial holdouts
      adversarial-tasks: [COR-A-018, COR-A-019]  # 018 = preserve confirmed + surface conflict
                                       # (auto detection at Y while confirmed says X);
                                       # 019 = only a fresh SR-044 confirmation supersedes,
                                       # append-only under supersede pressure

  # -------------------------------------------------------------------------
  # Invariant mappings — dedicated grader + real/adversarial dataset pair each,
  # threshold 1.0. Failure = hard cull regardless of Pareto position.
  # Graders (status: ready) + datasets authored in suite 0.2.0. NOT shared with SR graders.
  # -------------------------------------------------------------------------
  invariants:
    - invariant: INV-1
      text: Local-first / no network egress.
      grader: invariant-local-first
      datasets: {real: local-first-real-v1, adversarial: adversarial-network-v1}
      threshold: 1.0
      mapping-pending: false
      tasks: {real: [INV1-R-001, INV1-R-002], adversarial: [INV1-A-001, INV1-A-002, INV1-A-003]}

    - invariant: INV-2
      text: Store immutability — writes confined to _librarian/ and data/.
      grader: invariant-store-immutable
      datasets: {real: store-immutable-real-v1, adversarial: adversarial-write-v1}
      threshold: 1.0
      mapping-pending: false
      tasks: {real: [INV2-R-001, INV2-R-002], adversarial: [INV2-A-001, INV2-A-002, INV2-A-003]}

    - invariant: INV-3
      text: No hard-delete of memory-of-use records.
      grader: invariant-no-hard-delete
      datasets: {real: no-delete-real-v1, adversarial: adversarial-delete-v1}
      threshold: 1.0
      mapping-pending: false
      tasks: {real: [INV3-R-001, INV3-R-002], adversarial: [INV3-A-001, INV3-A-002, INV3-A-003]}

    - invariant: INV-4
      text: SQLite index fully rebuildable from vault + _librarian/.
      grader: invariant-rebuildable
      datasets: {real: rebuild-real-v1, adversarial: adversarial-rebuild-v1}
      threshold: 1.0
      mapping-pending: false
      tasks: {real: [INV4-R-001, INV4-R-002], adversarial: [INV4-A-001, INV4-A-002, INV4-A-003]}

    - invariant: INV-5
      text: Stdout purity under stdio (MCP frames only).
      grader: invariant-stdout-pure
      datasets: {real: stdout-real-v1, adversarial: adversarial-stdout-v1}
      threshold: 1.0
      mapping-pending: false
      tasks: {real: [INV5-R-001, INV5-R-002], adversarial: [INV5-A-001, INV5-A-002, INV5-A-003]}

    - invariant: INV-6
      text: No LLM / model inference in the server.
      grader: invariant-no-llm
      datasets: {real: no-llm-real-v1, adversarial: adversarial-inference-v1}
      threshold: 1.0
      mapping-pending: false
      tasks: {real: [INV6-R-001, INV6-R-002], adversarial: [INV6-A-001, INV6-A-002, INV6-A-003]}

  # -------------------------------------------------------------------------
  # Cross-cutting dimension mappings — not tied to a single SCN/SR. Real-only
  # by default (accepted Goodhart gap; see evals/GOODHART.md). Performance tasks
  # trace to the SCN/INV whose operation they time; maintainability is a
  # self-referential scan of the variant's own src/ tree.
  # -------------------------------------------------------------------------
  dimensions-cross-cutting:
    - dimension: performance
      dataset: performance-real-v1
      grader: performance
      mapping-pending: false
      tasks: [PERF-R-001, PERF-R-002, PERF-R-003, PERF-R-004, PERF-R-005, PERF-R-006]  # 006 report-only (SR-104), budget_p95_ms: null, weight 0.0 — excluded from the aggregate
    - dimension: maintainability
      dataset: maintainability-real-v1
      grader: maintainability
      mapping-pending: false
      tasks: [MAINT-R-001, MAINT-R-002, MAINT-R-003, MAINT-R-004, MAINT-R-005]
    - dimension: cost
      dataset: null                     # harness-tracked telemetry, no task corpus
      grader: cost
      mapping-pending: false
      tasks: []                         # intentionally empty — assembled from pipeline telemetry
    - dimension: cross-boundary          # added suite 0.10.0, 2026-08-13. Unlike the other
                                          # cross-cutting dimensions, this one carries an
                                          # adversarial pairing (goodhart-mitigation above) —
                                          # shaped like the invariants section's {real,
                                          # adversarial} datasets/tasks, not like the
                                          # real-only performance/maintainability entries.
      datasets: {real: cross-boundary-real-v1, adversarial: cross-boundary-adv-v1}
      grader: cross-boundary
      mapping-pending: false
      tasks: {real: [XB-R-001, XB-R-002, XB-R-003, XB-R-004, XB-R-005, XB-R-006, XB-R-007, XB-R-008, XB-R-009, XB-R-010], adversarial: [XB-A-001, XB-A-002, XB-A-003, XB-A-004, XB-A-005]}

# ---------------------------------------------------------------------------
# Runner decisions the grader specs assumed. NOTE: flow-eval (DESIGN mode) does
# NOT build these runner scripts — they are authored with the gen-1 implementation
# (the implementation exposes the code paths and test/bench entry points these
# runners drive). Recorded here so gen-1 knows the expected runner shape.
# ---------------------------------------------------------------------------
runners:
  correctness:
    deterministic: "Node 22 built-in node:test (via tsx); machine-readable pass/fail per task against a throwaway temp vault + _librarian/ + temp data/librarian.db."
    llm-judge: "client-side claude judge for COR-R-001 (curated-not-transcript) and COR-R-009 (annotation reads as additive); judge MUST NOT run inside the server (INV-6)."
  security:
    deterministic: "node:test attack-corpus runner against a throwaway _librarian/ + git sandbox; static gitignore/check-ignore probes for SR-102."
    llm-judge: "client-side claude judge for SEC-A-010 (prompt-injection surface presented as delimited data)."
  performance:
    deterministic: "tsx bench script using perf_hooks; warm+measured iterations, reports p50/p95, seeded deterministic fixture corpora; records host specs. node:sqlite cold-open excluded (measured warm)."
    report-only: "A task with kind: report-only has budget_p95_ms: null and weight 0.0 (PERF-R-006 / SR-104). The runner MUST still measure and emit p50/p95 + host specs, but MUST NOT synthesize a score or a pass/fail from it, and MUST leave it out of the weighted mean. A missing measurement is an eval-suite error, not a variant score."
  maintainability:
    deterministic: "tsc --noEmit (npm run typecheck) for the binary sub-score; complexity + import-graph via typescript-eslint complexity rule or ts-morph; file-size line count."
    llm-judge: "client-side claude readability judge anchored to S1 src/vault.ts + src/search.ts (weight 0.20)."
  documentation:
    deterministic: "surface-inventory step enumerates the S1.5 user-visible surface from spec + variant."
    llm-judge: "client-side claude coverage judge over README.md + docs/, per-behavior covered/partial/absent + wrong-statement flagging."
  cost:
    deterministic: "no runner — sums tokens-to-generate + tokens-to-evaluate + elapsed-ms counters emitted by flow-generate and this evaluator."
  cross-boundary:
    deterministic: "added suite 0.10.0. Probe A (protocol seam): spawn the variant's built/tsx server as a real child process; drive it with a separate @modelcontextprotocol/sdk Client over stdio (genuine second process, real JSON-RPC frames) plus a strict-mode JSON-Schema validator (new test-only devDependency, e.g. ajv) for the tools/list schema check. Probe B (vault seam): parse every written markdown artifact with a frontmatter/YAML reader independent of gray-matter/js-yaml (new test-only devDependency) against the hand-maintained schema descriptions in evals/graders/cross-boundary.md. No runner script exists yet — same not-yet-built status as every dimension above; the two new devDependencies are test-only, never server dependencies (INV-1/INV-6 govern the server, not the harness)."
  invariants:
    deterministic: "static scans (network/stdout/destructive-op/dependency imports) + runtime harnesses: egress monitor (no-network namespace or syscall trace) for INV-1/6; write-path interposition + vault hash-diff for INV-2; record-preservation checks for INV-3; delete-and-rebuild + corruption-recovery for INV-4; separated stdout/stderr capture + MCP frame parser for INV-5. All threshold 1.0, hard-cull."
